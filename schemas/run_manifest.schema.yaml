$schema: https://json-schema.org/draft/2020-12/schema
title: Notebook execution manifest
type: object
required:
  - schema_version
  - run_id
  - project_name
  - status
  - started_at
  - notebook
  - git_commit
  - checks
  - artifacts
properties:
  schema_version: {const: 1}
  run_id: {type: string, minLength: 1}
  project_name: {type: string, minLength: 1}
  status: {enum: [running, passed, failed]}
  started_at: {type: string, format: date-time}
  finished_at:
    type: [string, 'null']
    format: date-time
  notebook: {type: string, minLength: 1}
  executed_notebook:
    type: [string, 'null']
  git_commit:
    type: [string, 'null']
  error:
    type: [string, 'null']
  checks: {type: array}
  artifacts: {type: array}
