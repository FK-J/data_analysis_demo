$schema: https://json-schema.org/draft/2020-12/schema
title: Project development plan
type: object
additionalProperties: false
required: [schema_version, changes, tasks]
properties:
  schema_version: {const: 1}
  changes:
    type: array
    items:
      type: object
      additionalProperties: false
      required: [id, summary, task_ids, request_fingerprint]
      properties:
        id: {type: string, pattern: '^CHANGE-[0-9]{8}-[0-9]+$'}
        summary: {$ref: '#/$defs/text'}
        request_fingerprint: {type: string, pattern: '^[a-f0-9]{64}$'}
        task_ids:
          type: array
          minItems: 1
          uniqueItems: true
          items: {$ref: '#/$defs/text'}
  tasks:
    type: array
    minItems: 1
    items:
      type: object
      additionalProperties: false
      required: [id, title, stage, owner, status, dependencies, outputs, acceptance, evidence, blocker, next_action]
      properties:
        id: {$ref: '#/$defs/text'}
        title: {$ref: '#/$defs/text'}
        stage: {enum: [discovery, spec_confirmed, data_ready, quality_passed, analyzed, validated, reported, audited]}
        owner: {$ref: '#/$defs/text'}
        status: {enum: [pending, in_progress, blocked, completed, cancelled, revalidate]}
        dependencies:
          type: array
          uniqueItems: true
          items: {$ref: '#/$defs/text'}
        outputs:
          type: array
          uniqueItems: true
          items: {$ref: '#/$defs/text'}
        acceptance: {$ref: '#/$defs/text'}
        evidence: {type: string}
        blocker: {type: string}
        next_action: {type: string}
$defs:
  text: {type: string, minLength: 1, pattern: '\S'}
