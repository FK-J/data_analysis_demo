name: ci

on:
  push:
  pull_request:

jobs:
  quality-gates:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt ruff
      - name: Lint
        run: ruff check .
      - name: Tests
        run: python -m pytest -q
      - name: Integration tests
        run: python -m pytest -q -m integration
      - name: Validate framework template
        run: python scripts/validate_project.py
      - name: Audit framework template
        run: python scripts/audit_project.py
